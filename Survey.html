<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
     <title>Online Survey Form</title>
     <link rel="stylesheet" href="style.css" />
</head>
  <body>
<header>
 <h1>Online Survey Form</h1>
</header>
<div class="main-wrapper">
  
<!-- FORM + PREVIEW -->
<div class="top-card">
<div class="form-section">
<div class="field-group">
        <label>Name</label>
        <input id="name" type="text">
</div>
<div class="field-group">
<label>Email</label>
<input id="email" type="email">
</div>
<div class="field-group">
<label>Rating</label>
<select id="rating">
                 <option value="">Select a rating</option>
<option value="1">1 - Poor</option>
<option value="2">2 - Fair</option>
<option value="3">3 - Good</option>
<option value="4">4 - Very Good</option>
<option value="5">5 - Excellent</option>
</select>
</div>
  
<div class="field-group">
<label>Feedback</label>
<textarea id="feedback"></textarea>
</div>
  
<button id="submit-btn" type="button">Submit</button>
</div>
  
<!-- RIGHT SIDE -->
<div class="right-section">
<!-- LIVE PREVIEW -->
<div class="preview-box">
<div class="preview-title">Live Preview</div>
<p><b>Name:</b> <span id="preview-name">N/A</span></p>
<p><b>Email:</b> <span id="preview-email">N/A</span></p>
<p><b>Rating:</b> <span id="preview-rating">N/A</span></p>
<p><b>Feedback:</b> <span id="preview-feedback">N/A</span></p>
</div>
  
<!-- SUMMARY -->
<div class="summary-box">
<div class="summary-title">Summary</div>
<p>Total Responses: <span id="total-responses">0</span></p>
<p>Average Rating: <span id="avg-rating">N/A</span></p>
</div>
</div>
</div>
  
<!-- RESPONSES -->
<div class="responses-section">
<h2>Responses</h2>
<table>
<thead>
<tr>
      <th>Name</th>
      <th>Email</th>
      <th>Rating</th>
      <th>Feedback</th>
</tr>
</thead>
<tbody id="responses-body">
<tr>
<td colspan="4" id="no-responses">No responses yet</td>
</tr>
</tbody>
</table>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
